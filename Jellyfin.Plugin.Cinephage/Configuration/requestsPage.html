<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <title>Cinephage-verzoeken</title>
</head>
<body>
    <div id="CinephageRequestsPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button">
        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection">
                    <div style="display:flex;align-items:center;gap:1em;flex-wrap:wrap;">
                        <h2 class="sectionTitle" style="margin:0;">Cinephage-verzoeken</h2>
                        <button is="emby-button" type="button" id="CinephageRequestsRefresh" class="raised emby-button"><span>Vernieuwen</span></button>
                    </div>
                    <p class="fieldDescription">Wie welke film of serie heeft aangevraagd via Jellyfin. Deze lijst is een vast logboek; de kolom <i>Nu in Cinephage</i> wordt bij elke keer laden opnieuw bij Cinephage opgevraagd.</p>
                    <div id="CinephageRequestsNotice" class="fieldDescription"></div>
                </div>
                <div style="overflow-x:auto;">
                    <table id="CinephageRequestsTable" style="width:100%;border-collapse:collapse;">
                        <thead>
                            <tr style="text-align:left;">
                                <th style="padding:.5em;">Datum</th>
                                <th style="padding:.5em;">Gebruiker</th>
                                <th style="padding:.5em;">Titel</th>
                                <th style="padding:.5em;">Bij aanvraag</th>
                                <th style="padding:.5em;">Nu in Cinephage</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#CinephageRequestsPage');
                // Status recorded in the audit log at request time.
                var LOGGED = {
                    pending: 'Wacht op goedkeuring',
                    approved: 'Goedgekeurd',
                    awaiting_target: 'Wacht op release',
                    duplicate: 'Was al aangevraagd'
                };
                // Current state, worked out from Cinephage on every load.
                var CURRENT = {
                    pending: ['Wacht op goedkeuring', ''],
                    searching: ['Wordt gezocht', '#00a4dc'],
                    awaiting_target: ['Wacht op release', ''],
                    available: ['Beschikbaar', '#2ea043'],
                    in_library: ['In Cinephage', ''],
                    failed: ['Mislukt', '#d29922'],
                    declined: ['Afgewezen', '#d29922'],
                    expired: ['Verlopen', ''],
                    cancelled: ['Geannuleerd', ''],
                    removed: ['Niet meer in Cinephage', '#e5534b'],
                    unknown: ['Onbekend', '']
                };

                function esc(v) {
                    var d = document.createElement('div');
                    d.textContent = v == null ? '' : String(v);
                    return d.innerHTML;
                }

                function load() {
                    Dashboard.showLoadingMsg();
                    ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('Cinephage/Requests'), dataType: 'json' })
                        .then(function (data) {
                            var rows = (data.Requests || []).map(function (view) {
                                var r = view.Entry;
                                var current = CURRENT[view.CurrentStatus] || [view.CurrentStatus, ''];
                                var date = new Date(r.RequestedAt).toLocaleString();
                                var isSeries = r.MediaType === 'series';
                                var film = '<a href="https://www.themoviedb.org/' + (isSeries ? 'tv/' : 'movie/') + r.TmdbId + '" target="_blank" rel="noopener" style="color:inherit;">' +
                                    esc(r.Title) + (r.Year ? ' (' + r.Year + ')' : '') + '</a>' +
                                    (isSeries ? '<div class="fieldDescription" style="margin:0;">Serie · ' +
                                        esc((r.Seasons || []).map(function (s) { return 'S' + s; }).join(', ')) + '</div>' : '');
                                return '<tr style="border-top:1px solid rgba(128,128,128,.25);">' +
                                    '<td style="padding:.5em;white-space:nowrap;">' + esc(date) + '</td>' +
                                    '<td style="padding:.5em;">' + esc(r.Username) + '</td>' +
                                    '<td style="padding:.5em;">' + film + '</td>' +
                                    '<td style="padding:.5em;opacity:.75;">' + esc(LOGGED[r.Status] || r.Status || '—') + '</td>' +
                                    '<td style="padding:.5em;' + (current[1] ? 'color:' + current[1] + ';font-weight:600;' : '') + '">' + esc(current[0]) + '</td>' +
                                    '</tr>';
                            });
                            page.querySelector('tbody').innerHTML = rows.length ? rows.join('') :
                                '<tr><td colspan="5" style="padding:.5em;">Nog geen verzoeken.</td></tr>';
                            page.querySelector('#CinephageRequestsNotice').textContent = data.StatusAvailable ? '' :
                                '⚠️ Cinephage niet bereikbaar; de huidige stand is onbekend.';
                            Dashboard.hideLoadingMsg();
                        }, function () {
                            page.querySelector('#CinephageRequestsNotice').textContent = '❌ Verzoeken laden mislukt.';
                            Dashboard.hideLoadingMsg();
                        });
                }

                page.addEventListener('pageshow', load);
                page.querySelector('#CinephageRequestsRefresh').addEventListener('click', load);
            })();
        </script>
    </div>
</body>
</html>
